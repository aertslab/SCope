server {
    listen 80;
    server_name localhost;

    # Security headers — applied to every response. CSP is intentionally
    # permissive enough for the SPA: 'self' covers Vite's bundled assets,
    # and connect-src includes the API host (proxied at /api). Tighten the
    # script-src/style-src lists if external CDNs are ever introduced.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS: enforce HTTPS for the apex and all subdomains for 1 year. Only
    # served once the deployment terminates TLS in front of nginx; harmless
    # on plain HTTP since browsers ignore it on non-HTTPS responses.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 'unsafe-inline' is required for Vite-emitted runtime style tags; if a
    # nonce-based pipeline is added later, drop it from style-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
