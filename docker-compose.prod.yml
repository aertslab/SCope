version: '3.8'

# Production compose file. All secrets MUST be supplied via the host
# environment or a sibling .env file (see ./backend/.env.example). The
# database and Redis are intentionally NOT published to the host — only
# the frontend (and backend, indirectly via the frontend's nginx proxy)
# are reachable from outside the compose network.
#
# Required env vars at deploy time:
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   JWT_SECRET, SESSION_SECRET   (set in ./backend/.env)
#   FRONTEND_URL                  (HTTPS origin, e.g. https://scope.example.org)

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
    # No ports: stanza — Postgres is only reachable on the internal compose
    # network. Operators who need direct access should use `docker compose exec`.

  redis:
    image: redis:7-alpine
    # No ports: stanza for the same reason as db.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      # Persistent, shared dataset storage. MUST be shared with the worker so
      # the API can read the TileDB-SOMA stores the worker writes.
      - uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      # Secrets MUST be provided via backend/.env (JWT_SECRET, SESSION_SECRET).
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - uploads:/app/uploads  # shared with backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    # -B embeds the beat scheduler for the daily trash auto-purge. With multiple
    # worker replicas, drop -B here and run a single dedicated `celery -A
    # app.worker beat` service instead to avoid duplicate scheduling.
    command: celery -A app.worker worker --loglevel=info -B

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
