[project]
name = "scope-backend"
version = "2.0.0"
description = "Modernized backend for SCope"
authors = [{name = "SCope Team"}]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.6",
    "email-validator>=2.1.0.post1",
    "anndata>=0.10.5",
    "zarr>=2.16.1",
    # TileDB-SOMA (CZI CELLxGENE Census standard) — sparse, out-of-core,
    # both-axis random access for 10s of millions of cells. Ships prebuilt
    # cp313 manylinux wheels, so no source build on the python:3.13-slim base.
    "tiledbsoma>=1.15.0",
    "celery>=5.3.6",
    "redis>=5.0.1",
    "httpx>=0.26.0",
    "loompy>=3.0.7",
    "typer>=0.9.0",
    "authlib>=1.3.0",
    "itsdangerous>=2.1.2",
    "aiofiles>=23.2.1",
    "psutil>=5.9.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.4",
    "aiosqlite>=0.19.0",
    "ruff>=0.3.0",
    "black>=24.1.1",
    "isort>=5.13.2",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Enforce genuine errors (syntax, undefined names, broken f-strings) but not
# style, so CI stays green on the existing codebase while still catching real
# bugs. Tighten the selection over time.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning"
]
