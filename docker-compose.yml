version: '3.8'

# Development compose file. Postgres and Redis are published to the host
# for direct psql/redis-cli access. The backend reads secrets from
# ./backend/.env (copy from ./backend/.env.example). Set
# ALLOW_INSECURE_SECRETS=true in that file to skip the production
# secret guards for local work; do NOT use this file for production
# deployments \u2014 use docker-compose.prod.yml.

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=scope
      - POSTGRES_PASSWORD=scope_password
      - POSTGRES_DB=scope_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://scope:scope_password@db:5432/scope_db
      - REDIS_URL=redis://redis:6379/0
      # Secrets MUST be provided via backend/.env (JWT_SECRET, SESSION_SECRET).
      # For local dev only, set ALLOW_INSECURE_SECRETS=true in .env.
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://scope:scope_password@db:5432/scope_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: celery -A app.worker worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_TARGET=http://backend:8000
    command: npm run dev
    depends_on:
      - backend

volumes:
  postgres_data:
