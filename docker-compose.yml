version: '3.8'

# Development compose file. Postgres and Redis are published to the host
# for direct psql/redis-cli access. The backend reads secrets from
# ./backend/.env (copy from ./backend/.env.example). Set
# ALLOW_INSECURE_SECRETS=true in that file to skip the production
# secret guards for local work; do NOT use this file for production
# deployments \u2014 use docker-compose.prod.yml.

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=scope
      - POSTGRES_PASSWORD=scope_password
      - POSTGRES_DB=scope_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      # Dataset files / TileDB-SOMA stores live in a Docker-managed volume,
      # NOT under the bind-mounted source tree. This keeps thousands of SOMA
      # chunk files out of any host-side file watcher / git working tree, and
      # is shared with the worker (which writes the conversions the API reads).
      - uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://scope:scope_password@db:5432/scope_db
      - REDIS_URL=redis://redis:6379/0
      # Secrets MUST be provided via backend/.env (JWT_SECRET, SESSION_SECRET).
      # For local dev only, set ALLOW_INSECURE_SECRETS=true in .env.
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    # Watch ONLY the source package for hot-reload. Without --reload-dir, uvicorn
    # recursively watches the whole working dir including ./uploads — and a
    # TileDB-SOMA store has thousands of files, which exhausts the inotify watch
    # limit ("Cannot allocate memory (os error 12)") the moment a dataset is
    # converted. Restricting the watch root keeps reload working at any scale.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - uploads:/app/uploads  # shared with backend (see note above)
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://scope:scope_password@db:5432/scope_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    # -B runs the embedded beat scheduler (daily trash auto-purge). Fine for a
    # single worker; for multiple replicas run one dedicated `celery beat` instead.
    command: celery -A app.worker worker --loglevel=info -B

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_TARGET=http://backend:8000
    command: npm run dev
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
